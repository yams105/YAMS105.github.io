<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>尚湖初中 食品订单管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;background:#f0f4f8;padding:12px;color:#1e293b;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app-container{max-width:1400px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:16px 16px 24px}
.header{border-bottom:3px solid #2563eb;padding-bottom:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.header h1{font-size:clamp(18px,5vw,26px);font-weight:700;color:#0f172a;letter-spacing:.5px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;line-height:1.3}
.header h1 .editable-span{cursor:pointer;padding:0 4px;border-radius:4px;transition:background .2s;border-bottom:2px solid transparent;font-weight:700}
.header h1 .editable-span:hover{background:#eef2f6;border-bottom-color:#2563eb}
.header h1 small{font-size:clamp(14px,3.5vw,18px);font-weight:400;color:#475569;margin-left:2px;display:inline-flex;align-items:center}
.header-info{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:clamp(12px,2.8vw,15px);color:#334155;background:#f8fafc;padding:6px 14px;border-radius:40px;border:1px solid #e2e8f0;width:100%;justify-content:center}
.header-info span{white-space:nowrap}
.header-info strong{color:#0f172a}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:16px;background:#f8fafc;padding:12px 16px;border-radius:14px;border:1px solid #e2e8f0}
.toolbar .ratio-group{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;flex:1 1 auto}
.toolbar .ratio-group label{font-weight:600;font-size:clamp(13px,2.8vw,15px);color:#1e293b}
.toolbar .ratio-group input{width:50px;padding:4px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:clamp(14px,3vw,16px);text-align:center;font-weight:600;background:#fff;transition:border-color .2s;min-height:36px}
.toolbar .ratio-group input:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.toolbar .ratio-group .ratio-colon{font-weight:700;font-size:clamp(16px,3.5vw,20px);color:#475569}
.toolbar .ratio-group .ratio-hint{font-weight:500;color:#475569;font-size:clamp(11px,2.4vw,14px);margin-left:2px}
.toolbar .btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{padding:8px 16px;border:none;border-radius:40px;font-size:clamp(12px,2.6vw,14px);font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;background:#e2e8f0;color:#1e293b;touch-action:manipulation;min-height:40px;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-outline{background:transparent;border:1.5px solid #cbd5e1}
.btn-ghost-danger{background:transparent;color:#94a3b8;border:1px solid transparent;padding:2px 10px;border-radius:30px;font-size:clamp(12px,2.4vw,13px);cursor:pointer;transition:all .2s;min-height:32px}
.btn-ghost-danger:active{background:#fee2e2;color:#dc2626}
.btn-info{background:#0ea5e9;color:#fff}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-purple:active{background:#7c3aed}
.btn-sm{padding:4px 10px;font-size:clamp(11px,2.2vw,13px);min-height:30px}
.sample-section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;margin-bottom:20px}
.sample-section .sample-title{font-size:clamp(14px,3vw,16px);font-weight:600;color:#475569;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sample-section .sample-title .badge{background:#e2e8f0;padding:2px 12px;border-radius:30px;font-size:clamp(10px,2vw,12px);color:#475569}
.sample-table-wrap{overflow-x:auto;max-height:360px;overflow-y:auto}
.sample-table{width:100%;min-width:420px;border-collapse:collapse;font-size:clamp(11px,2.4vw,13px);background:#fff;border-radius:8px}
.sample-table th{background:#e9edf4;padding:5px 6px;border:1px solid #d1d9e6;text-align:center;font-weight:600;color:#1e293b;white-space:nowrap}
.sample-table td{padding:4px 6px;border:1px solid #d1d9e6;text-align:center;word-break:break-word}
.agent-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.agent-header h2{font-size:clamp(16px,4vw,20px);font-weight:600;color:#0f172a}
.agent-header .save-hint{font-size:clamp(11px,2.4vw,14px);color:#64748b}
.day-block{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.day-block:last-child{margin-bottom:0}
.day-header{background:#f1f5f9;padding:10px 14px;font-size:clamp(15px,3.8vw,18px);font-weight:700;color:#0f172a;border-bottom:1px solid #e2e8f0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.day-header .day-name{cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .2s;flex:1 1 auto}
.day-header .day-name:hover{background:#e2e8f0}
.day-header .day-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.day-header .day-actions .btn{padding:4px 12px;font-size:clamp(11px,2.2vw,13px);min-height:32px}
.dish-block{border-bottom:1px dashed #e2e8f0;padding-bottom:8px;margin-bottom:8px}
.dish-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.dish-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fafcff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;gap:8px;flex-wrap:wrap}
.dish-header .dish-name{font-weight:700;font-size:clamp(13px,3vw,15px);color:#1e40af;cursor:pointer;padding:2px 8px;border-radius:4px;transition:background .2s;background:#dbeafe}
.dish-header .dish-name:hover{background:#bfdbfe}
.dish-header .dish-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dish-header .dish-actions .btn{padding:3px 10px;font-size:clamp(10px,2.2vw,12px);min-height:28px}
.items-table-wrap{overflow-x:auto;padding:0 2px 2px 2px}
.items-table{width:100%;min-width:480px;border-collapse:collapse;font-size:clamp(12px,2.6vw,14px)}
.items-table th{background:#f1f5f9;text-align:center;padding:6px 4px;font-weight:600;color:#334155;border-bottom:2px solid #d1d9e6;font-size:clamp(11px,2.2vw,13px);white-space:nowrap}
.items-table td{padding:4px;border-bottom:1px solid #eef2f6;vertical-align:middle;text-align:center}
.items-table tr:last-child td{border-bottom:none}
.items-table .col-name{min-width:70px;text-align:left;font-weight:500}
.items-table .col-name input{width:100%;min-width:50px;border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;font-size:clamp(12px,2.6vw,14px);font-weight:500;transition:border-color .2s}
.items-table .col-name input:hover{background:#f8fafc}
.items-table .col-name input:focus{border-color:#2563eb;background:#fff;outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.items-table .col-num input{width:60px;text-align:center;padding:3px 2px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:clamp(12px,2.6vw,14px);font-weight:500;background:#fff;transition:border-color .2s}
.items-table .col-num input:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.items-table .col-num .auto-value{display:inline-block;min-width:36px;padding:3px 2px;font-weight:600;color:#0f172a;background:#f8fafc;border-radius:4px;font-size:clamp(12px,2.6vw,14px)}
.items-table .col-note input{width:100%;min-width:50px;border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;font-size:clamp(11px,2.4vw,13px);color:#475569;transition:border-color .2s}
.items-table .col-note input:hover{background:#f8fafc}
.items-table .col-note input:focus{border-color:#2563eb;background:#fff;outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.items-table .col-action{width:36px;text-align:center}
.items-table .col-action .btn{padding:2px 6px;font-size:clamp(11px,2.2vw,13px);border-radius:30px;background:transparent;color:#94a3b8;border:1px solid transparent;min-height:28px}
.items-table .col-action .btn:active{background:#fee2e2;color:#dc2626}
.items-table .col-idx{width:28px;text-align:center;font-size:clamp(11px,2.2vw,13px);color:#94a3b8;font-weight:500}
.items-table .empty-row td{padding:12px 10px;color:#94a3b8;font-style:italic;text-align:center;font-size:clamp(11px,2.2vw,13px)}
.add-row-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;margin:4px 0 6px 12px;border:1.5px dashed #cbd5e1;border-radius:30px;background:transparent;font-size:clamp(11px,2.2vw,12px);font-weight:500;color:#475569;cursor:pointer;transition:all .2s;min-height:30px}
.add-row-btn:active{border-color:#2563eb;color:#2563eb;background:#eff6ff}
.draft-section{margin-top:20px;padding-top:16px;border-top:2px solid #e2e8f0}
.draft-header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.draft-header h3{font-size:clamp(16px,3.5vw,18px);font-weight:600;color:#0f172a;margin-right:8px}
.draft-header .draft-input-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 auto}
.draft-header .draft-input-group input{padding:6px 10px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:clamp(13px,2.6vw,14px);min-width:120px;flex:1 1 150px;min-height:36px}
.draft-header .draft-input-group input:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.draft-list{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow-y:auto;padding:4px 0}
.draft-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:clamp(12px,2.4vw,14px);width:100%}
.draft-item .draft-info{flex:1 1 150px;display:flex;flex-wrap:wrap;gap:4px 12px}
.draft-item .draft-info .draft-name{font-weight:600;color:#0f172a}
.draft-item .draft-info .draft-time{color:#64748b;font-size:clamp(11px,2.2vw,13px)}
.draft-item .draft-actions{display:flex;gap:4px;flex-wrap:wrap}
.draft-item .draft-actions .btn{padding:2px 10px;font-size:clamp(11px,2.2vw,13px);min-height:28px}
.empty-drafts{color:#94a3b8;font-style:italic;padding:8px 0}
.auto-save-badge{background:#dbeafe;color:#1d4ed8;border-radius:30px;padding:0 10px;font-size:clamp(10px,2vw,12px);font-weight:500}
.dish-card{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;padding:10px 14px;background:#fff}
.dish-card .dish-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.dish-card .dish-card-title{font-weight:700;font-size:clamp(14px,3vw,16px);color:#0f172a}
.dish-card .dish-card-title .belong-dish{font-size:clamp(11px,2.2vw,13px);color:#0ea5e9;font-weight:600;background:#e0f2fe;padding:1px 8px;border-radius:4px;margin-left:6px}
.dish-card .dish-card-meta{font-size:clamp(11px,2.2vw,13px);color:#64748b}
.dish-card .dish-card-latest{font-size:clamp(12px,2.4vw,13px);color:#334155;margin-bottom:8px;padding:8px 10px;background:#f0f9ff;border-radius:6px;border-left:3px solid #0ea5e9}
.dish-card .dish-card-latest .label{font-weight:600;color:#0c4a6e;margin-right:4px}
.dish-card details summary{cursor:pointer;font-size:clamp(11px,2.2vw,13px);color:#475569;font-weight:500;padding:6px 0;user-select:none;list-style:none}
.dish-card details summary::-webkit-details-marker{display:none}
.dish-card details summary::before{content:'▶ ';font-size:10px;color:#94a3b8}
.dish-card details[open] summary::before{content:'▼ '}
.dish-card details summary:hover{color:#2563eb}
.history-snapshot{padding:8px 10px;border-bottom:1px dashed #eef2f6;background:#fafcff;border-radius:6px;margin-bottom:6px;font-size:clamp(11px,2.2vw,13px)}
.history-snapshot:last-child{margin-bottom:0}
.history-snapshot .snap-time{color:#94a3b8;font-size:clamp(10px,2vw,12px);display:block;margin-bottom:4px}
.history-snapshot .item-tag{display:inline-block;background:#fff;border:1px solid #d1d9e6;border-radius:4px;padding:1px 6px;margin:2px 4px 2px 0;font-size:clamp(10px,2vw,12px);color:#334155}
.history-snapshot .item-tag strong{color:#0f172a}
.raw-material-item{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;transition:all .2s}
.raw-material-item:hover{border-color:#0ea5e9;background:#f0f9ff;transform:translateX(2px)}
.raw-material-item .raw-name{font-weight:600;color:#0f172a;font-size:clamp(13px,2.6vw,15px)}
.raw-material-item .raw-meta{font-size:clamp(11px,2.2vw,13px);color:#64748b;margin-top:2px}
.raw-material-item .raw-count{font-size:clamp(10px,2vw,12px);color:#94a3b8;background:#f1f5f9;padding:2px 8px;border-radius:20px;white-space:nowrap}

/* 原材料库 */
.lib-dish-card{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;padding:12px 14px;background:#fff}
.lib-dish-card .lib-dish-title{font-weight:700;font-size:clamp(14px,3vw,16px);color:#0f172a;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.lib-dish-card .lib-dish-title .lib-count{font-size:clamp(10px,2vw,12px);color:#8b5cf6;background:#ede9fe;padding:2px 10px;border-radius:20px;font-weight:600}
.lib-data-buttons{display:flex;flex-wrap:wrap;gap:8px}
.lib-data-item{display:inline-flex;align-items:stretch;border:1.5px solid #8b5cf6;border-radius:8px;overflow:hidden;transition:all .2s;background:#f5f3ff}
.lib-data-item:hover{box-shadow:0 2px 8px rgba(139,92,246,.25)}
.lib-data-btn{padding:6px 12px;border:none;background:transparent;color:#6d28d9;cursor:pointer;font-size:clamp(11px,2.4vw,13px);font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:4px;touch-action:manipulation;min-height:32px}
.lib-data-btn:hover{background:#8b5cf6;color:#fff}
.lib-data-btn:active{transform:scale(.96)}
.lib-data-btn .btn-meta{font-size:clamp(9px,1.9vw,11px);opacity:.85;font-weight:500}
.lib-del-btn{padding:0 10px;border:none;border-left:1.5px solid #8b5cf6;background:transparent;color:#8b5cf6;cursor:pointer;font-size:clamp(12px,2.4vw,14px);font-weight:700;transition:all .2s;touch-action:manipulation;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
.lib-del-btn:hover{background:#dc2626;color:#fff;border-left-color:#dc2626}
.lib-del-btn:active{transform:scale(.96)}

.footer-actions{margin-top:20px;padding-top:16px;border-top:2px solid #e2e8f0;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.footer-actions .btn{padding:10px 20px;font-size:clamp(13px,3vw,15px);min-height:44px;flex:1 1 auto;max-width:100%}
.empty-state{padding:30px 16px;text-align:center;color:#94a3b8;font-size:clamp(14px,3vw,16px);border:2px dashed #e2e8f0;border-radius:14px;margin-bottom:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#f8fafc;padding:10px 22px;border-radius:40px;font-size:clamp(13px,2.8vw,15px);font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:all .4s ease;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.warning{background:#f59e0b}
.ratio-badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:2px 12px;border-radius:30px;font-weight:600;font-size:clamp(12px,2.6vw,14px);margin-left:2px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-box{background:#fff;padding:24px 20px;border-radius:16px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-box h3{margin-bottom:14px;font-size:clamp(18px,4.5vw,22px);font-weight:700;color:#0f172a}
.modal-box .field-group{margin-bottom:12px}
.modal-box .field-group label{display:block;font-weight:600;font-size:clamp(13px,2.8vw,15px);color:#334155;margin-bottom:4px}
.modal-box .field-group input[type="text"]{width:100%;padding:8px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:clamp(14px,3vw,16px);transition:border-color .2s}
.modal-box .field-group input[type="text"]:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.modal-box .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.modal-box .modal-actions .btn{min-height:40px;padding:8px 20px;flex:1 1 auto}
@media(max-width:768px){
body{padding:8px}
.app-container{padding:12px}
.header{flex-direction:column;align-items:stretch;gap:8px}
.header h1{justify-content:center;text-align:center}
.header-info{width:100%;justify-content:center;font-size:clamp(11px,2.6vw,13px);padding:4px 10px;gap:4px 12px;flex-wrap:wrap}
.toolbar{flex-direction:column;align-items:stretch;gap:10px;padding:12px}
.toolbar .ratio-group{justify-content:center}
.toolbar .btn-group{margin-left:0;justify-content:center;flex-wrap:wrap}
.btn{padding:6px 14px;font-size:clamp(11px,2.6vw,13px);min-height:36px}
.day-header{padding:8px 12px;font-size:clamp(14px,3.5vw,16px)}
.dish-header{padding:6px 10px}
.items-table{min-width:400px;font-size:clamp(11px,2.4vw,13px)}
.items-table th{font-size:clamp(10px,2.2vw,12px);padding:4px 3px}
.items-table td{padding:3px}
.items-table .col-num input{width:48px;font-size:clamp(11px,2.4vw,13px);padding:2px}
.items-table .col-num .auto-value{font-size:clamp(11px,2.4vw,13px);min-width:30px}
.items-table .col-name input{font-size:clamp(11px,2.4vw,13px);padding:2px 3px}
.items-table .col-note input{font-size:clamp(10px,2.2vw,12px);padding:2px 3px}
.items-table .col-idx{font-size:clamp(10px,2.2vw,12px);width:24px}
.items-table .col-action{width:30px}
.items-table .col-action .btn{font-size:clamp(10px,2.2vw,12px);min-height:24px;padding:1px 4px}
.add-row-btn{font-size:clamp(10px,2.2vw,12px);padding:3px 12px;min-height:30px;margin:2px 0 6px 8px}
.footer-actions{flex-direction:column;gap:8px}
.footer-actions .btn{width:100%;justify-content:center;padding:10px 16px;font-size:clamp(13px,3vw,15px);min-height:44px}
.sample-table{min-width:340px;font-size:clamp(10px,2.2vw,12px)}
.sample-table th,.sample-table td{padding:3px 4px}
.modal-box{padding:18px 16px;margin:8px}
.modal-box .modal-actions .btn{min-height:38px;padding:6px 16px}
.draft-header .draft-input-group input{min-width:80px}
.draft-item{flex-direction:column;align-items:stretch}
.draft-item .draft-actions{justify-content:flex-end}
}
@media(max-width:480px){
body{padding:4px}
.app-container{padding:8px}
.header h1{font-size:clamp(16px,4.5vw,20px)}
.header h1 small{font-size:clamp(12px,3vw,15px)}
.toolbar{padding:8px 10px;gap:8px}
.toolbar .ratio-group input{width:42px;font-size:clamp(13px,3vw,15px);min-height:32px;padding:2px}

<script>
// ============================================================
// 示例数据
// ============================================================
const SAMPLE_DATA={school:'尚湖初中',contact:'王亚俐',phone:'528939',unit:'斤',week:'第2周',dateRange:'9月7日 — 9月11日',days:[
{name:'周一',items:[{name:'前腿肉',total:150,note:''},{name:'油泡',total:30,note:''},{name:'三层腊肉',total:15,note:''},{name:'球菜',total:125,note:''},{name:'丝瓜',total:20,note:''},{name:'西红柿',total:25,note:''},{name:'青菜',total:60,note:''},{name:'鸡蛋',total:20,note:''},{name:'年糕',total:130,note:''},{name:'豆腐',total:25,note:''},{name:'烧麦',total:410,note:'个'},{name:'蚝油',total:12,note:''}]},
{name:'周二',items:[{name:'梅干菜',total:11,note:''},{name:'前腿肉',total:196,note:''},{name:'脆山药',total:56,note:''},{name:'干木耳',total:3,note:''},{name:'紫菜',total:1,note:''},{name:'鸡蛋',total:21,note:''},{name:'整只鸭',total:100,note:''},{name:'藕',total:110,note:''}]},
{name:'周三',items:[{name:'前腿肉',total:117,note:''},{name:'胡萝卜',total:28,note:''},{name:'青圆椒',total:21,note:''},{name:'洋葱',total:7,note:''},{name:'玉米粒',total:112,note:''},{name:'青豆',total:35,note:''}]},
{name:'周四',items:[{name:'大排',total:700,note:'片'},{name:'球菜',total:112,note:''},{name:'干番薯粉丝',total:21,note:''},{name:'平菇',total:20,note:''}]},
{name:'周五',items:[{name:'明虾',total:130,note:''},{name:'香菇',total:24,note:''},{name:'青菜',total:120,note:''}]}
]};

// ============================================================
// 存储 Key 与全局变量
// ============================================================
const STORAGE_KEY='foodOrderData_v29';
const DRAFTS_KEY='foodOrderDrafts_v1';
const DISHES_KEY='foodOrderPastDishes_v5';
const RAW_KEY='foodOrderPastRaw_v3';
const LIBRARY_KEY='foodOrderIngredientLib_v1';

let appData=null;
let saveTimeout=null;
let drafts=[];
let autoSaveInterval=null;
let pastDishes={};
let pastRawMaterials={};
let ingredientLibrary={};
let currentPastDishTarget=null;
let currentPastRawTarget=null;
let currentPastRawDishName='';
let currentLibTarget=null;
let historyCurrentTab='dish';

// ============================================================
// 数据加载
// ============================================================
function loadAppData(){
const stored=localStorage.getItem(STORAGE_KEY);
if(stored){
try{
const parsed=JSON.parse(stored);
const defaultMeta={school:'尚湖初中',contact:'王亚俐',phone:'528939',unit:'斤',week:'第2周',dateRange:'9月7日 — 9月11日',ratioStudent:7,ratioTeacher:1,days:[]};
appData=mergeDeep(defaultMeta,parsed);
appData.days.forEach(day=>{
if(day.items&&Array.isArray(day.items)&&!day.dishes){day.dishes=[{name:'菜品1',items:day.items}];delete day.items}
else if(!day.dishes){day.dishes=[]}
day.dishes.forEach(dish=>{
if(!dish.items)dish.items=[];
dish.items.forEach(item=>{
if(item.total===undefined)item.total=0;
if(item.note===undefined)item.note='';
});
});
});
return;
}catch(e){console.warn('读取存储失败',e)}
}
appData={school:'尚湖初中',contact:'王亚俐',phone:'528939',unit:'斤',week:'第2周',dateRange:'9月7日 — 9月11日',ratioStudent:7,ratioTeacher:1,days:[]};
}

function saveAppData(){
if(!appData)return;
clearTimeout(saveTimeout);
saveTimeout=setTimeout(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appData))}catch(e){console.warn('保存失败',e)}},150);
}

function cloneDeep(o){return JSON.parse(JSON.stringify(o))}

function mergeDeep(target,source){
const result=cloneDeep(target);
for(const key in source){
if(source.hasOwnProperty(key)){
if(source[key]&&typeof source[key]==='object'&&!Array.isArray(source[key])){result[key]=mergeDeep(result[key]||{},source[key])}
else{result[key]=source[key]}
}
}
return result;
}

// ============================================================
// 往期菜品、往期原材料、原材料库 加载
// ============================================================
function loadPastDishes(){
const stored=localStorage.getItem(DISHES_KEY);
if(stored){try{pastDishes=JSON.parse(stored)||{};if(typeof pastDishes!=='object')pastDishes={}}catch(e){pastDishes={}}}
else{pastDishes={}}
}

function loadPastRawMaterials(){
const stored=localStorage.getItem(RAW_KEY);
if(stored){
try{
const parsed=JSON.parse(stored);
if(!parsed||typeof parsed!=='object'){pastRawMaterials={};return}
const keys=Object.keys(parsed);
const hasNewFormat=keys.some(k=>k.includes('::'));
if(hasNewFormat||keys.length===0){pastRawMaterials=parsed}
else{
const migrated={};
keys.forEach(k=>{
const old=parsed[k];
if(old&&old.name){
const newKey=`未知菜品::${old.name}`;
migrated[newKey]={name:old.name,dishName:'未知菜品',lastTotal:old.lastTotal||0,lastNote:old.lastNote||'',lastUsed:old.lastUsed||Date.now(),history:old.history||[]};
}
});
pastRawMaterials=migrated;
savePastRawMaterials();
}
}catch(e){pastRawMaterials={}}
}
else{pastRawMaterials={}}
}

function loadIngredientLibrary(){
const stored=localStorage.getItem(LIBRARY_KEY);
if(stored){
try{
ingredientLibrary=JSON.parse(stored)||{};
if(typeof ingredientLibrary!=='object')ingredientLibrary={};
}catch(e){ingredientLibrary={}}
}
else{ingredientLibrary={}}
}

function savePastDishes(){try{localStorage.setItem(DISHES_KEY,JSON.stringify(pastDishes))}catch(e){console.warn('保存往期菜品失败',e)}}
function savePastRawMaterials(){try{localStorage.setItem(RAW_KEY,JSON.stringify(pastRawMaterials))}catch(e){console.warn('保存往期原材料失败',e)}}
function saveIngredientLibrary(){try{localStorage.setItem(LIBRARY_KEY,JSON.stringify(ingredientLibrary))}catch(e){console.warn('保存原材料库失败',e)}}

// ============================================================
// 记录菜品快照
// ============================================================
function recordDishSnapshot(dayIdx,dishIdx){
const day=appData.days[dayIdx];
if(!day)return;
const dish=day.dishes[dishIdx];
if(!dish||!dish.name||dish.name==='未命名')return;
const items=(dish.items||[]).filter(i=>i.name&&i.name.trim()&&i.name!=='未命名').map(i=>({name:i.name.trim(),total:parseFloat(i.total)||0,note:i.note||''}));
if(items.length===0)return;
const key=dish.name.trim();
const snapshot={timestamp:Date.now(),items:JSON.parse(JSON.stringify(items))};
if(!pastDishes[key]){
pastDishes[key]={name:key,lastUsed:Date.now(),lastItems:JSON.parse(JSON.stringify(items)),history:[snapshot]};
}else{
pastDishes[key].lastUsed=Date.now();
pastDishes[key].lastItems=JSON.parse(JSON.stringify(items));
const last=pastDishes[key].history[pastDishes[key].history.length-1];
const changed=!last||JSON.stringify(last.items)!==JSON.stringify(items);
if(changed){
pastDishes[key].history.push(snapshot);
if(pastDishes[key].history.length>100)pastDishes[key].history.shift();
}
}
savePastDishes();
}

// ============================================================
// 记录单个原材料
// ============================================================
function recordRawMaterial(dishName,rawName,total,note){
if(!dishName||!dishName.trim()||dishName==='未命名')return;
if(!rawName||!rawName.trim())return;
const rawTrim=rawName.trim();
const dishTrim=dishName.trim();
if(rawTrim==='未命名')return;
const key=`${dishTrim}::${rawTrim}`;
const t=parseFloat(total)||0;
const n=note||'';
if(!pastRawMaterials[key]){
pastRawMaterials[key]={name:rawTrim,dishName:dishTrim,lastTotal:t,lastNote:n,lastUsed:Date.now(),history:[{timestamp:Date.now(),total:t,note:n}]};
}else{
pastRawMaterials[key].lastUsed=Date.now();
pastRawMaterials[key].lastTotal=t;
pastRawMaterials[key].lastNote=n;
const last=pastRawMaterials[key].history[pastRawMaterials[key].history.length-1];
if(!last||last.total!==t||last.note!==n){
pastRawMaterials[key].history.push({timestamp:Date.now(),total:t,note:n});
if(pastRawMaterials[key].history.length>100)pastRawMaterials[key].history.shift();
}
}
savePastRawMaterials();
}

// ============================================================
// 原材料库
// ============================================================
function addToLibraryDirect(name,total,note,dishName){
const key=name.trim();
if(!key||key==='未命名')return false;
const t=parseFloat(total)||0;
const n=note||'';
if(!ingredientLibrary[key]){
ingredientLibrary[key]=[{total:t,note:n,dishName:dishName||'',addedAt:Date.now()}];
saveIngredientLibrary();
return true;
}
const dup=ingredientLibrary[key].some(e=>e.total===t&&e.note===n);
if(dup)return false;
ingredientLibrary[key].push({total:t,note:n,dishName:dishName||'',addedAt:Date.now()});
saveIngredientLibrary();
return true;
}

function checkAndAddToLibrary(name,total,note,dishName){
const key=name?name.trim():'';
if(!key||key==='未命名')return;
const t=parseFloat(total)||0;
const n=note||'';
if(!ingredientLibrary[key]){
ingredientLibrary[key]=[{total:t,note:n,dishName:dishName||'',addedAt:Date.now()}];
saveIngredientLibrary();
return;
}
if(ingredientLibrary[key].some(e=>e.total===t&&e.note===n))return;

const existingList=ingredientLibrary[key].map(e=>`合计${e.total}${e.note?'（'+e.note+'）':''}${e.dishName?' ['+e.dishName+']':''}`).join('、');
const msg=`原材料“${key}”已存在不同的合计数据：\n已有：${existingList}\n当前：合计${t}${n?'（'+n+'）':''}${dishName?' ['+dishName+']':''}\n\n是否将当前数据也加入原材料库？`;
showConfirmModal(msg,'原材料入库确认').then(ok=>{
if(ok){
ingredientLibrary[key].push({total:t,note:n,dishName:dishName||'',addedAt:Date.now()});
saveIngredientLibrary();
showToast(`已将“${key}”（合计 ${t}）加入原材料库`,'success');
// 若当前原材料库面板正打开，刷新内容
const libOverlay=document.getElementById('ingredientLibModalOverlay');
if(libOverlay&&libOverlay.classList.contains('active')){
const searchInput=document.getElementById('ingredientLibSearchInput');
renderIngredientLibContent(searchInput?searchInput.value.trim():'');
}
}
});
}

/**
 * 删除原材料库中某个原材料的某个数据按钮
 */
function deleteIngredientLibItem(name,total,note,addedAt){
if(!name)return;
const list=ingredientLibrary[name];
if(!list||!Array.isArray(list))return;
// 优先按 addedAt 精确匹配，其次按 total + note 匹配
let idx=-1;
if(typeof addedAt==='number'){
idx=list.findIndex(e=>e.addedAt===addedAt);
}
if(idx<0){
idx=list.findIndex(e=>e.total===total&&(e.note||'')===(note||''));
}
if(idx<0)return;
list.splice(idx,1);
if(list.length===0){
delete ingredientLibrary[name];
}
saveIngredientLibrary();
showToast(`已删除“${name}”的一条数据`,'success');
// 刷新面板
const searchInput=document.getElementById('ingredientLibSearchInput');
renderIngredientLibContent(searchInput?searchInput.value.trim():'');
}

function migrateRawMaterialsOnDishRename(oldName,newName){
if(!oldName||!newName||oldName===newName)return;
const keysToMigrate=Object.keys(pastRawMaterials).filter(k=>{
const rec=pastRawMaterials[k];
return rec&&rec.dishName===oldName;
});
keysToMigrate.forEach(oldKey=>{
const rec=pastRawMaterials[oldKey];
const newKey=`${newName}::${rec.name}`;
pastRawMaterials[newKey]={...rec,dishName:newName,lastUsed:Date.now()};
delete pastRawMaterials[oldKey];
});
if(keysToMigrate.length>0)savePastRawMaterials();
let libChanged=false;
Object.keys(ingredientLibrary).forEach(name=>{
(ingredientLibrary[name]||[]).forEach(e=>{
if(e.dishName===oldName){e.dishName=newName;libChanged=true}
});
});
if(libChanged)saveIngredientLibrary();
}

function loadDrafts(){

function saveDrafts(){try{localStorage.setItem(DRAFTS_KEY,JSON.stringify(drafts))}catch(e){console.warn('保存草稿失败',e)}}
function generateId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function formatTimestamp(ts){const d=new Date(ts);return d.toLocaleString('zh-CN',{hour12:false})}

function addDraft(name,data){
const draft={id:generateId(),name:name||'未命名草稿',timestamp:Date.now(),data:cloneDeep(data)};
if(name==='自动保存'){
const existing=drafts.find(d=>d.name==='自动保存');
if(existing){existing.data=cloneDeep(data);existing.timestamp=Date.now();saveDrafts();renderDraftList();return existing}
}
drafts.push(draft);
saveDrafts();
renderDraftList();
return draft;
}

function deleteDraft(id){drafts=drafts.filter(d=>d.id!==id);saveDrafts();renderDraftList()}

function loadDraft(id){
const draft=drafts.find(d=>d.id===id);
if(!draft){showToast('草稿不存在','error');return}
appData=cloneDeep(draft.data);
if(!appData.days)appData.days=[];
appData.days.forEach(day=>{
if(!day.dishes)day.dishes=[];
day.dishes.forEach(dish=>{
if(!dish.items)dish.items=[];
dish.items.forEach(item=>{if(item.total===undefined)item.total=0;if(item.note===undefined)item.note=''});
});
});
saveAppData();
renderApp();
showToast(`已加载草稿：${draft.name}`,'success');
}

function exportDraft(id){
const draft=drafts.find(d=>d.id===id);
if(!draft){showToast('草稿不存在','error');return}
exportXlsxData(draft.data,`草稿_${draft.name}_${formatTimestamp(draft.timestamp)}`);
}

function escapeHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ============================================================
// 计算工具
// ============================================================
function calcStudentTeacher(total,sRatio,tRatio){
if(total===undefined||total===null||isNaN(total))return{student:0,teacher:0};
const num=parseFloat(total);
if(isNaN(num)||num<0)return{student:0,teacher:0};
const sum=sRatio+tRatio;
if(sum===0)return{student:0,teacher:0};
const student=Math.round((num*sRatio)/sum*100)/100;
const teacher=Math.round((num-student)*100)/100;
return{student,teacher};
}

function scheduleRecordDishSnapshot(dayIdx,dishIdx){
const day=appData.days[dayIdx];

if(!dish)return;

function scheduleRecordRaw(dishName,item){
if(!item||!dishName)return;
clearTimeout(item._rawTimer);
item._rawTimer=setTimeout(()=>{
if(item.name&&item.name!=='未命名'){
recordRawMaterial(dishName,item.name,item.total,item.note);
checkAndAddToLibrary(item.name,item.total,item.note,dishName);
}
},800);
}

// 导出 .xlsx
// ============================================================
function exportXlsxData(data,customFileName){
if(!data)return;
if(!data.days)data.days=[];
const school=data.school||'尚湖初中';
const week=data.week||'第2周';
const dateRange=data.dateRange||'9月7日 — 9月11日';
const contact=data.contact||'王亚俐';
const phone=data.phone||'528939';
const unit=data.unit||'斤';
const days=data.days||[];
const sRatio=data.ratioStudent||7;
const tRatio=data.ratioTeacher||1;

const script=document.createElement('script');
script.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
script.onload=function(){doExport(true)};
script.onerror=function(){
const fallback=document.createElement('script');
fallback.src='https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
fallback.onload=function(){doExport(false)};
fallback.onerror=function(){showToast('加载导出库失败','error')};
document.head.appendChild(fallback);
};
document.head.appendChild(script);

function doExport(supportStyle){
try{
const wb=XLSX.utils.book_new();
const rows=[];
const colCount=26;
rows.push([`${school} ${week} 食品订单（${dateRange}）`,...Array(colCount-1).fill('')]);
rows.push([`学校：${school} 经办人：${contact} 联系电话：${phone} 单位：${unit}`,...Array(colCount-1).fill('')]);
const weekRow=['序号'];
const dayNames=days.map(d=>d.name||'');
while(dayNames.length<5)dayNames.push('');
dayNames.forEach(name=>weekRow.push(name,'','','',''));
while(weekRow.length<colCount)weekRow.push('');
rows.push(weekRow);
const headerRow1=[''];
dayNames.forEach(()=>headerRow1.push('品名','','','','备注'));
while(headerRow1.length<colCount)headerRow1.push('');
rows.push(headerRow1);
const headerRow2=[''];
dayNames.forEach(()=>headerRow2.push('','学生','老师','合计',''));
while(headerRow2.length<colCount)headerRow2.push('');
rows.push(headerRow2);

const dayFlattenItems=days.map(day=>{
const out=[];
(day.dishes||[]).forEach(dish=>{(dish.items||[]).forEach(item=>out.push(item))});
return out;
});
let maxItems=0;
dayFlattenItems.forEach(items=>{if(items.length>maxItems)maxItems=items.length});
if(maxItems===0)maxItems=1;
for(let i=0;i<maxItems;i++){
const rowData=[i+1];
dayFlattenItems.forEach(items=>{
if(i<items.length){
const item=items[i];
const total=item.total||0;
const {student,teacher}=calcStudentTeacher(total,sRatio,tRatio);
rowData.push(item.name||'',Math.round(student*100)/100,Math.round(teacher*100)/100,total,item.note||'');
}else{rowData.push('','','','','')}
});
while(rowData.length<colCount)rowData.push('');
rows.push(rowData);
}
const ws=XLSX.utils.aoa_to_sheet(rows);
const merges=[{s:{r:0,c:0},e:{r:0,c:colCount-1}},{s:{r:1,c:0},e:{r:1,c:colCount-1}}];
days.forEach((day,idx)=>{const startC=1+idx*5;merges.push({s:{r:2,c:startC},e:{r:2,c:startC+4}})});
ws['!merges']=merges;
const colWidths=[{wch:6}];
for(let i=0;i<5;i++){colWidths.push({wch:12},{wch:8},{wch:8},{wch:8},{wch:12})}
ws['!cols']=colWidths;
if(supportStyle&&ws['!rows']!==undefined){
const range=XLSX.utils.decode_range(ws['!ref']);
for(let R=range.s.r;R<=range.e.r;R++){
for(let C=range.s.c;C<=range.e.c;C++){
const addr=XLSX.utils.encode_cell({r:R,c:C});
if(!ws[addr])continue;
if(!ws[addr].s)ws[addr].s={};
ws[addr].s.alignment={horizontal:'center',vertical:'center'};
ws[addr].s.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
}
}
}
XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
const fileName=customFileName?`${customFileName}.xlsx`:`${school}_食品订单_${dateRange}.xlsx`;
XLSX.writeFile(wb,fileName);
showToast(`导出成功：${fileName}`,'success');
}catch(e){console.error(e);showToast('导出失败：'+e.message,'error')}
}
}

// ============================================================
// Toast
// ============================================================
function showToast(msg,type){
const el=document.getElementById('toast');
el.textContent=msg;
el.className='toast '+(type||'');
void el.offsetWidth;
el.classList.add('show');
clearTimeout(el._hideTimer);
el._hideTimer=setTimeout(()=>{el.classList.remove('show')},2200);
}
